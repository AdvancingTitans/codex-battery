name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal app and test three localizations
        run: ./build.sh
      - name: Check documentation and localization consistency
        run: python3 scripts/check-project.py
      - name: Verify clean release extraction
        run: ./scripts/verify-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/CodexBattery-*-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
