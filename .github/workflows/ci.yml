name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build universal app and test three localizations
        run: ./build.sh
      - name: Check documentation and localization consistency
        run: python3 scripts/check-project.py
      - name: Verify clean release extraction
        run: ./scripts/verify-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/CodexBattery-*-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-15
          path: release
      - name: Publish the exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
          (cd release && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "release/CodexBattery-$VERSION-universal.zip" release/SHA256SUMS \
            --verify-tag --title "Codex Battery $GITHUB_REF_NAME" \
            --notes-file "docs/RELEASE_NOTES_$GITHUB_REF_NAME.md"
