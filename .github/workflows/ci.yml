name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build universal app and test three localizations
        run: ./build.sh
      - name: Check documentation and localization consistency
        run: python3 scripts/check-project.py
      - name: Verify clean release extraction
        run: ./scripts/verify-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/CodexBattery-*-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
